<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Paws Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#1b0f2e;--pn:#2b1850;--pn2:#3a2275;--felt:#0d5a49;--gold:#ffcb47;--cor:#ff5d73;--mint:#3ef0c1;--cr:#fff3d9;--ink:#12081f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cr);font:600 16px/1.4 Nunito,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#3d1f78 0,transparent 45%),radial-gradient(circle at 90% 100%,#5a1d5e 0,transparent 40%),var(--bg)}
h1,.bg{font-family:Bungee,Impact,sans-serif;font-weight:400;letter-spacing:.02em}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:.6em 1.1em;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b88a12;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a12}
button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:var(--pn2);color:var(--cr);box-shadow:0 4px 0 #1d1040}
button.sel{background:var(--mint);color:var(--ink);box-shadow:0 4px 0 #1b9f7e}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
input{font:inherit;font-weight:800;padding:.55em .8em;border-radius:12px;border:2px solid var(--pn2);background:#150a26;color:var(--cr);min-width:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:center}
.card{background:var(--pn);border-radius:20px;padding:1.2rem;border:2px solid var(--pn2)}
.big{font:400 2.4rem Bungee,Impact,sans-serif;text-align:center;min-height:3rem}
.hint{font-size:.85rem;opacity:.7;text-align:center;margin:.6rem 0 0}
#intro{max-width:460px;margin:0 auto;padding:2rem 1rem;display:grid;gap:1.2rem}
.hero{text-align:center}.hero h1{font-size:2.8rem;margin:.2rem 0;color:var(--gold);text-shadow:0 4px 0 #8a2a45,0 0 30px #ff5d7388;line-height:1}
.cat{font-size:6rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#avs{display:grid;grid-template-columns:repeat(8,1fr);gap:.4rem;margin:.8rem 0}
#avs button{font-size:1.6rem;padding:.2em;background:var(--pn2);box-shadow:none}
#avs button.sel{background:var(--gold);transform:scale(1.12)}
#err{color:var(--cor);min-height:1.2em;margin:.4rem 0 0;text-align:center}
header{display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;background:#12081fcc;border-bottom:3px solid var(--gold);flex-wrap:wrap}
header>.bg{color:var(--gold);font-size:1.4rem}
#room{margin-right:auto;padding:.3em .8em;font-size:.9rem}
#meb{display:flex;align-items:center;gap:.7rem}
#mav{font-size:2rem}#meb small{display:block;opacity:.75;font-size:.8rem}
#bal{font-size:1.7rem;color:var(--mint);padding:.1em .5em;border-radius:10px;background:#150a26}
#bal.neg{color:var(--cor)}#bal.up{animation:fu .6s}#bal.dn{animation:fd .6s}
@keyframes fu{30%{background:var(--mint);color:var(--ink);transform:scale(1.15)}}
@keyframes fd{30%{background:var(--cor);color:#fff;transform:scale(.92)}}
main{display:grid;grid-template-columns:150px 1fr 290px;gap:1rem;padding:1rem;max-width:1250px;margin:0 auto}
#menu{display:grid;gap:.5rem;align-content:start}
#menu button{display:flex;align-items:center;gap:.5rem;text-align:left;background:var(--pn);color:var(--cr);box-shadow:0 4px 0 #1d1040;border:2px solid var(--pn2)}
#menu button.sel{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 4px 0 #b88a12}
#menu span{font-size:1.5rem}
#stage{background:radial-gradient(ellipse at 50% 30%,#13846a,var(--felt) 70%);border-radius:24px;border:6px solid #5a3a1c;box-shadow:inset 0 0 40px #0006,0 8px 0 #2e1c0c;padding:1rem;display:flex;flex-direction:column;gap:1rem;min-height:640px}
#dealer{display:flex;align-items:center;gap:.8rem}
.dc{font-size:3.6rem;animation:bob 3s ease-in-out infinite}
#bub{background:var(--cr);color:var(--ink);padding:.5em .9em;border-radius:16px 16px 16px 4px;font-weight:800;quotes:none}
#gm{flex:1;display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center}
#gm .go{min-width:200px;font-size:1.2rem}
#betbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center;background:#0005;padding:.7rem;border-radius:16px}
.chip{width:50px;height:50px;border-radius:50%!important;padding:0!important;color:#fff!important;border:4px dashed #fffb!important;box-shadow:0 3px 0 #0006!important}
#bt{width:92px}
aside{display:grid;gap:1rem;align-content:start}
#pl,#lgw{background:var(--pn);border:2px solid var(--pn2);border-radius:18px;padding:.8rem}
#pl h3,#lgw h3{margin:0 0 .5rem;font:400 1rem Bungee,sans-serif;color:var(--gold)}
.pr{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #fff2}
.pr b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .am{font-family:Bungee,sans-serif;font-size:.9rem;color:var(--mint)}.pr .am.neg{color:var(--cor)}
.pr button{padding:.2em .6em;font-size:.8rem;box-shadow:none}
#lg{height:230px;overflow:auto;font-size:.9rem;display:flex;flex-direction:column;gap:.3rem;margin-bottom:.5rem}
#lg div{padding:.3em .6em;background:#0004;border-radius:8px;overflow-wrap:anywhere}
#lg .win{background:#ffcb4733}#lg .gift{background:#ff5d7333}
#ci{width:100%}
.reels{display:flex;gap:.6rem}.reel{width:92px;height:110px;background:var(--cr);border-radius:16px;font-size:3.6rem;display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--gold),inset 0 8px 14px #0004}
.reel.spin{filter:blur(1.5px)}
.hand{display:flex;gap:.4rem;align-items:center;min-height:96px;flex-wrap:wrap;justify-content:center}.hand em{font-style:normal;background:#0006;border-radius:8px;padding:.1em .5em}
.card.c,.pc{display:inline-grid;width:62px;height:88px;background:var(--cr);color:var(--ink);border-radius:8px;place-items:center;font:800 1.3rem Nunito;line-height:1;box-shadow:0 3px 0 #0006;animation:deal .25s}
.pc.r{color:#d11f45}.pc.back{background:repeating-linear-gradient(45deg,var(--cor) 0 6px,#b8344a 6px 12px);border:4px solid var(--cream,#fff3d9)}
@keyframes deal{from{transform:translateY(-20px) rotate(-8deg);opacity:0}}
.wh{position:relative;width:250px;height:250px}
#wd{position:absolute;inset:0;border-radius:50%;border:8px solid var(--gold);transition:transform 3.2s cubic-bezier(.12,.7,.15,1);box-shadow:0 0 0 6px #5a3a1c,0 10px 20px #0006}
.wh>i{position:absolute;left:50%;top:-14px;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid var(--cor);z-index:2;filter:drop-shadow(0 2px 0 #0006)}
.wl{position:absolute;left:50%;top:50%;font:400 .9rem Bungee,sans-serif;color:#12081f}
.ro,.nums,.mg{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;max-width:560px}
.nums button{width:38px;padding:.3em 0;font-size:.8rem;color:#fff;box-shadow:none}
.nums .rd{background:#c42a4b}.nums .bk{background:#1a1226}.nums .gr{background:#1b9f5a}.nums .sel{outline:3px solid var(--gold)}
.cr{position:relative;width:min(420px,100%);height:210px;background:#0a1e3a;border-radius:18px;overflow:hidden;border:4px solid #0007;background-image:radial-gradient(#fff6 1px,transparent 1px);background-size:30px 30px}
#mult{position:absolute;inset:0;display:grid;place-items:center;font:400 3.4rem Bungee,sans-serif}
#rk{position:absolute;left:8px;bottom:6px;font-size:2.4rem;transition:none}
.mg{display:grid;grid-template-columns:repeat(5,64px);gap:.4rem}
.mg button{height:64px;padding:0;font-size:1.7rem;background:var(--pn2);color:var(--cr);box-shadow:0 4px 0 #1d1040}
.coin{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,var(--gold) 55%,#c68d12);display:grid;place-items:center;font-size:4rem;box-shadow:0 6px 0 #8a640c,0 0 0 6px #fff4;margin:.5rem}
.coin.flip{animation:fl 1.1s ease-in}@keyframes fl{to{transform:rotateY(1440deg) translateY(0)}50%{transform:rotateY(720deg) translateY(-70px)}}
input[type=range]{width:min(380px,90%);accent-color:var(--gold)}
dialog{border:3px solid var(--gold);border-radius:20px;background:var(--pn);color:var(--cr);padding:1.2rem}
dialog::backdrop{background:#000a}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#cnt{font-size:.9rem;padding:.3em .8em;border-radius:999px;background:#150a26;color:var(--mint)}
#ann{background:var(--cor);color:#fff;text-align:center;padding:.6rem 1rem;font:400 1rem Bungee,sans-serif}
#pl{max-height:340px;overflow:auto}
.pr .pk{display:block;font-size:.7rem;opacity:.6;font-weight:600;font-family:Nunito,sans-serif;text-align:right}
.pr.mt b{text-decoration:line-through;opacity:.6}
#ad{width:min(680px,94vw)}#ad h3{font-family:Bungee,sans-serif;font-weight:400;color:var(--gold);margin:.6rem 0 .2rem}
.ar{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;padding:.4rem 0;border-bottom:1px solid #fff2}.ar b{flex:1;min-width:110px}.ar input{width:84px;padding:.3em .5em}.ar button{padding:.25em .6em;font-size:.8rem;box-shadow:none}
@media(max-width:960px){main{grid-template-columns:1fr}#menu{grid-template-columns:repeat(4,1fr)}#menu button{flex-direction:column;text-align:center;font-size:.8rem;padding:.4em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div id="intro">
 <div class="hero"><div class="cat">😼</div><h1>Lucky Paws<br>Casino</h1><p>Pretend money, real odds. Everyone starts with $100, and going into debt is allowed.</p></div>
 <div class="card">
  <label>Your name<br><input id="nm" maxlength="14" placeholder="Whiskers" style="width:100%;margin-top:.3rem"></label>
  <div id="avs"></div>
  <div class="row"><button id="solo">Play solo</button><button id="hostb">Host a table</button></div>
  <div class="row" style="margin-top:.8rem"><input id="jc" maxlength="4" placeholder="Table code" style="width:130px;text-transform:uppercase"><button id="joinb" class="alt">Join friends</button></div>
  <p id="err"></p>
 </div>
</div>

<div id="app" hidden>
 <header><span class="bg">Lucky Paws</span><span id="cnt"></span><button id="room" class="alt"></button><button id="admb" class="alt" title="Admin panel">🔧</button>
  <div id="meb"><span id="mav"></span><div><b id="mn"></b><small id="ms"></small></div><span id="bal" class="bg"></span></div></header><div id="ann" hidden></div>
 <main>
  <nav id="menu"></nav>
  <section id="stage">
   <div id="dealer"><span class="dc">😼</span><q id="bub">Place your bets!</q></div>
   <div id="gm"></div>
   <div id="betbar"></div>
  </section>
  <aside>
   <div id="pl"></div>
   <div id="lgw"><h3>Table talk</h3><div id="lg"></div><input id="ci" maxlength="140" placeholder="Say something, press Enter"></div>
  </aside>
 </main>
</div>
<dialog id="gd"><p id="gt"></p><input id="ga" type="number" min="1" value="10"><div class="row" style="margin-top:.8rem"><button id="gok">Send gift</button><button id="gno" class="alt">Cancel</button></div></dialog>

<dialog id="ad"><button class="alt" id="adx" style="float:right" onclick="this.closest('dialog').close()">Close</button><div id="adb"></div></dialog>

<script>
const $=(s,e=document)=>e.querySelector(s);
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296,ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n*100)/100).toLocaleString();
const AV=['🦊','🐸','🐙','🦄','🐼','🐲','🦖','🐧'];
const ADMIN_HASH='f2d615a0967cc2b1055bd37150029cf5862a08ccdecde67c0b9c593485aefae2';/* SHA-256 of the admin password. See notes to change it. */
let adminH='',pendH='',cfg={closed:0,max:1000},muted=new Set();
let me={name:'',av:'🦊',bal:100},myid=Math.random().toString(36).slice(2,10),mq=null,seen={},known={},watchT=0,host=true,players={},room='',busy=0,cur='',pubT;
try{Object.assign(me,JSON.parse(localStorage.lpc||'{}'))}catch(e){}
const save=()=>{try{localStorage.lpc=JSON.stringify(me)}catch(e){}};

/* ---------- money ---------- */
function add(n){
 me.bal=Math.round((me.bal+n)*100)/100;me.peak=Math.max(me.peak||0,me.bal);save();drawMe();
 const b=$('#bal');b.classList.remove('up','dn');void b.offsetWidth;if(n)b.classList.add(n>0?'up':'dn');
 clearTimeout(pubT);pubT=setTimeout(pub,150);
}
function drawMe(){
 $('#mav').textContent=me.av;$('#mn').textContent=me.name;
 const b=$('#bal');b.textContent=fmt(me.bal);b.classList.toggle('neg',me.bal<0);
 $('#ms').textContent=me.bal<0?'In debt. The cat is watching.':me.bal>=1000?'High roller':me.bal>=100?'Doing fine':'Running low';
}
function pub(){send({t:'me',p:{name:me.name,av:me.av,bal:me.bal,peak:me.peak||me.bal}})}
const WIN=['Ooh, shiny!','You rascal!','Pay the player!','Lucky paws!','Nine lives of luck!'];
const LOSE=['The house purrs.','Ouch! Again?','Meow... unlucky.','So close!','Chin up, kitten.'];
function say(t){$('#bub').textContent=t}
function rain(e){for(let i=0;i<26;i++){const s=document.createElement('span');s.className='fall';s.textContent=pick(e);s.style.left=ri(95)+'vw';s.style.animationDelay=rnd()*.8+'s';document.body.append(s);setTimeout(()=>s.remove(),3400)}}
function settle(g,b,pay){
 if(pay)add(pay);
 if(pay>=b*5&&pay>=100){log(`🎉 ${me.name} won ${fmt(pay)} on ${g}!`);say(pick(WIN));rain(['💰','🪙','✨','🎉'])}
 else if(pay>b)say(pick(WIN));
 else if(pay==b)say('A push. Nobody wins.');
 else{say(pick(LOSE));if(b>=100)log(`😬 ${me.name} lost ${fmt(b)} on ${g}`)}
}
function getBet(){if(cfg.closed){say('The casino is closed by the admin.');return 0}let v=Math.floor(+$('#bt').value);if(!(v>=1)){say('Pick a bet first!');return 0}v=Math.min(v,cfg.max);$('#bt').value=v;return v}

/* ---------- networking (PeerJS star: first player hosts) ---------- */
/* Transport: public MQTT-over-WebSocket brokers act as a relay (no WebRTC, so no firewall/NAT trouble). */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'],NS='lucky-paws-7k2/';
const T=(r,x)=>NS+r+'/'+x,genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[ri(24)]).join('');
function mqSend(tp,m,retain){if(mq&&mq.connected)mq.publish(tp,JSON.stringify(m),{qos:1,retain:!!retain})}
function send(m){if(host)hostRecv(myid,m);else mqSend(T(room,'up'),{...m,from:myid})}
function sendTo(id,m){if(id===myid)handle(m);else mqSend(T(room,'to/'+id),m)}
function bcast(m){mqSend(T(room,'down'),m);handle(m)}
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function hostRecv(from,m){
 if(!m||typeof m!=='object')return;
 const p=players[from],reply=x=>sendTo(from,x);
 if(m.t==='me'&&m.p){
  players[from]={name:String(m.p.name||'?').slice(0,14),av:AV.includes(m.p.av)?m.p.av:'🦊',bal:Math.round((+m.p.bal||0)*100)/100,peak:Math.round(Math.max(+m.p.peak||0,+m.p.bal||0)*100)/100,muted:muted.has(from)};
  if(from!==myid&&!known[from]){known[from]=1;reply({t:'cfg',...cfg})}
  bcast({t:'players',p:players})}
 else if(m.t==='bye'){delete players[from];delete known[from];delete seen[from];bcast({t:'players',p:players})}
 else if(m.t==='log')bcast({t:'log',x:String(m.x).slice(0,140),k:'win'});
 else if(m.t==='chat'&&p){if(muted.has(from))reply({t:'log',x:'You are muted by the admin.'});else bcast({t:'chat',n:p.name,av:p.av,x:String(m.x).slice(0,140)})}
 else if(m.t==='gift'&&p){
  const amt=Math.min(Math.max(+m.amt||0,0),1e6);if(!amt||!players[m.to])return;
  sendTo(m.to,{t:'gift',to:m.to,amt,fn:p.name});
  bcast({t:'log',x:`🎁 ${p.name} gifted ${fmt(amt)} to ${players[m.to].name}`,k:'gift'});
 }
 else if(m.t==='adminlogin')reply({t:m.h===ADMIN_HASH?'adminok':'adminno'});
 else if(m.t==='admin'&&m.h===ADMIN_HASH)adminDo(m);
}
function adminDo(m){
 const to=m.to,t=players[to],v=Math.round((+m.v||0)*100)/100,L=x=>bcast({t:'log',x:'🔧 '+x,k:'gift'});
 if(m.op==='set'&&t){sendTo(to,{t:'adm',to,op:'set',v});L(`Admin set ${t.name}'s balance to ${fmt(v)}`)}
 else if(m.op==='add'&&t){sendTo(to,{t:'adm',to,op:'add',v});L(`Admin ${v<0?'took '+fmt(-v)+' from':'gave '+fmt(v)+' to'} ${t.name}`)}
 else if(m.op==='mute'&&t){muted.has(to)?muted.delete(to):muted.add(to);t.muted=muted.has(to);bcast({t:'players',p:players});L(`${t.name} was ${t.muted?'muted':'unmuted'}`)}
 else if(m.op==='kick'&&t&&to!==myid){sendTo(to,{t:'kick'});delete players[to];delete known[to];delete seen[to];bcast({t:'players',p:players});L(`${t.name} was removed`)}
 else if(m.op==='ann')bcast({t:'ann',x:String(m.x).slice(0,120)});
 else if(m.op==='resetall'){bcast({t:'adm',op:'set',v:100});L('Admin reset everyone to $100')}
 else if(m.op==='cfg'){cfg={closed:m.closed?1:0,max:Math.min(Math.max(Math.floor(+m.max)||1000,1),100000)};bcast({t:'cfg',...cfg});L(cfg.closed?'The casino is closed':'The casino is open (max bet '+fmt(cfg.max)+')')}
}
function handle(m){
 if(!m||typeof m!=='object')return;
 if(m.t==='players'){players=m.p;drawPl();admRefresh()}
 else if(m.t==='log')addLog(m.x,m.k);
 else if(m.t==='chat')addLog(`${m.av} ${m.n}: ${m.x}`);
 else if(m.t==='gift'&&m.to===myid){add(m.amt);say(`${m.fn} sent you ${fmt(m.amt)}!`);rain(['🎁','💖'])}
 else if(m.t==='adm'&&(!m.to||m.to===myid)){const v=+m.v||0;if(m.op==='set'){me.bal=Math.round(v*100)/100;add(0)}else if(m.op==='add')add(v)}
 else if(m.t==='ann')showAnn(m.x);
 else if(m.t==='cfg'){cfg={closed:m.closed?1:0,max:+m.max||1000};if(cfg.closed)say('The casino is closed.');admRefresh()}
 else if(m.t==='kick'){alert('You were removed from the table.');location.hash='';location.reload()}
 else if(m.t==='adminok'){adminH=pendH;admRender()}
 else if(m.t==='adminno'){const e=$('#aderr');if(e)e.textContent='Wrong password.'}
}
function addLog(x,k){const d=document.createElement('div');d.textContent=x;if(k)d.className=k;const l=$('#lg');l.append(d);while(l.children.length>60)l.firstChild.remove();l.scrollTop=1e9}
const log=x=>send({t:'log',x});
function drawPl(){
 const L=Object.entries(players).sort((a,b)=>b[1].bal-a[1].bal),el=$('#pl');
 $('#cnt').textContent='🟢 '+L.length+' online';
 el.innerHTML='<h3>Leaderboard</h3>';
 L.forEach(([id,p],i)=>{const r=document.createElement('div');r.className='pr'+(p.muted?' mt':'');
  r.innerHTML=`<span>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</span><span>${esc(p.av)}</span><b>${esc(p.name)}${id===myid?' (you)':''}</b><span class="am ${p.bal<0?'neg':''}">${fmt(p.bal)}<span class="pk">best ${fmt(p.peak||p.bal)}</span></span>`;
  if(id!==myid){const b=document.createElement('button');b.className='alt';b.textContent='Gift';b.onclick=()=>gift(id,p.name);r.append(b)}
  el.append(r)});
}
function gift(id,n){$('#gt').textContent='Gift play money to '+n;$('#gd').showModal();$('#gok').onclick=()=>{const a=Math.floor(+$('#ga').value);if(a>=1){add(-a);send({t:'gift',to:id,amt:a});$('#gd').close()}};}
$('#gno').onclick=()=>$('#gd').close();
function mqOnce(i,opts){return new Promise(res=>{
 let c,d=0;const f=ok=>{if(d)return;d=1;clearTimeout(t);if(ok)res(c);else{try{c.end(true)}catch(e){}res(null)}};
 const t=setTimeout(()=>f(0),6000);

async function setupHost(){

  let taken=0;const probe=(tp,pl)=>{if(tp===T(code,'host')&&pl.length)taken=1};
  c.on('message',probe);c.subscribe(T(code,'host'),{qos:1});await sleep(1200);

  setInterval(()=>{const n=Date.now();let ch=0;for(const id in seen)if(n-seen[id]>30000){delete seen[id];delete known[id];delete players[id];ch=1}
   bcast({t:'players',p:players});if(ch)addLog('A player timed out.')},8000);
